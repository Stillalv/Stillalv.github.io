<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Stream Hub</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <style>
    :root {
      --netflix-red: #E50914;
      --bg-color: #141414;
      --card-bg: #1f1f1f;
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      padding: 18px 4%;
      background: rgba(20,20,20,0.96);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--netflix-red);
      letter-spacing: 1px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 20px 4%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 14px;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0,1fr));
      }
    }

    .category-card {
      background: linear-gradient(145deg, #2c2c2c, #171717);
      border-radius: 16px;
      padding: 30px 12px;
      text-align: center;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.04);
      transition: 0.2s;
    }

    .category-card:active {
      transform: scale(0.96);
    }

    .category-icon {
      display: block;
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    .category-name {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 170px;
      border: 1px solid rgba(255,255,255,0.03);
      transition: 0.2s;
    }

    .match-card:active {
      transform: scale(0.98);
    }

    .match-card h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 10px 0;
      line-height: 1.4;
    }

    .match-card p {
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status-live {
      background: var(--netflix-red);
      color: white;
      animation: pulse 2s infinite;
    }

    .status-upcoming {
      background: #444;
      color: #ccc;
    }

    .countdown-timer {
      margin-top: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: #ffcc00;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .local-time {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .back-btn {
      background: #333;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }

    @keyframes pulse {
      0% {opacity: 1;}
      50% {opacity: 0.6;}
      100% {opacity: 1;}
    }

    #player-view {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 200;
      display: flex;
      flex-direction: column;
    }

    .player-header {
      padding: 12px;
      background: #141414;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .player-title {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #server-selector {
      background: #222;
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      max-width: 150px;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
      max-height: 60vh;
    }

    #stream-player {
      width: 100%;
      height: 100%;
      border: none;
    }

    #player-view:fullscreen .video-wrapper,
    #player-view:-webkit-full-screen .video-wrapper {
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
      aspect-ratio: auto;
    }

    #player-view:fullscreen iframe,
    #player-view:-webkit-full-screen iframe {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      .video-wrapper {
        max-height: 40vh;
      }

      #server-selector {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

<header>SPORTSFLIX</header>

<div class="container">

  <div id="view-categories">
    <h2 style="margin-bottom:20px;">Choose Sport</h2>
    <div id="loading" style="text-align:center; padding:50px;">Connecting...</div>
    <div class="grid" id="category-list"></div>
  </div>

  <div id="view-matches" class="hidden">
    <button class="back-btn" onclick="showCategories()">← Back</button>
    <h2 id="match-title-text" style="margin:20px 0;"></h2>
    <div class="grid" id="match-list"></div>
  </div>

</div>

<div id="player-view" class="hidden">
  <div class="player-header">
    <button class="back-btn" onclick="closePlayer()">← Close</button>
    <div id="player-info" class="player-title"></div>
    <select id="server-selector"></select>
  </div>

  <div class="video-wrapper">
    <iframe
      id="stream-player"
      allowfullscreen
      webkitallowfullscreen
      mozallowfullscreen
      allow="encrypted-media; picture-in-picture; fullscreen"
      sandbox="allow-scripts allow-same-origin allow-fullscreen"
      referrerpolicy="no-referrer">
    </iframe>
  </div>
</div>

<script>
const sportIcons = {
  football: '⚽',
  basketball: '🏀',
  amfootball: '🏈',
  baseball: '⚾',
  badminton: '🏸',
  volleyball: '🏐',
  tennis: '🎾',
  race: '🏁',
  fight: '🥊',
  other: '🎯'
};

let sportsData = {};
let currentOpenSport = null;
let timerInterval = null;

async function loadData() {
  try {
    const res = await fetch(
      'https://api.embedsportex.site/api/streams?cache=' + Date.now()
    );

    sportsData = await res.json();

    document.getElementById('loading').classList.add('hidden');

    renderCategoryMenu();

    if (currentOpenSport) {
      renderMatchList(currentOpenSport);
    }

  } catch (e) {
    console.error("API Error", e);
  }
}

function renderCategoryMenu() {
  const list = document.getElementById('category-list');
  list.innerHTML = '';

  Object.keys(sportsData).forEach(sport => {
    if (Array.isArray(sportsData[sport]) && sportsData[sport].length > 0) {
      const card = document.createElement('div');
      card.className = 'category-card';

      card.innerHTML = `
        <span class="category-icon">${sportIcons[sport] || '🎯'}</span>
        <span class="category-name">${sport}</span>
      `;

      card.onclick = () => renderMatchList(sport);

      list.appendChild(card);
    }
  });
}

function renderMatchList(sport) {
  currentOpenSport = sport;

  document.getElementById('view-categories').classList.add('hidden');
  document.getElementById('view-matches').classList.remove('hidden');

  document.getElementById('match-title-text').innerHTML =
    `${sportIcons[sport] || ''} ${sport} Schedule`;

  const list = document.getElementById('match-list');
  list.innerHTML = '';

  sportsData[sport].forEach((match, index) => {
    const kickoff = new Date(match.kickoff.replace(' ', 'T') + '+07:00');

    const timeString = kickoff.toLocaleTimeString([], {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });

    const dateString = kickoff.toLocaleDateString([], {
      day: 'numeric',
      month: 'short'
    });

    const card = document.createElement('div');
    card.className = 'match-card';

    card.innerHTML = `
      <div>
        <div id="status-${sport}-${index}"></div>
        <h3>${match.tag}</h3>
        <p>${match.league}</p>
      </div>

      <div>
        <div class="local-time">📅 ${dateString} • 🕒 ${timeString}</div>
        <div id="timer-${sport}-${index}" class="countdown-timer"></div>
      </div>
    `;

    card.onclick = () => openPlayer(match);

    list.appendChild(card);

    updateTimerDisplay(
      kickoff,
      `timer-${sport}-${index}`,
      `status-${sport}-${index}`
    );
  });

  if (timerInterval) clearInterval(timerInterval);

  timerInterval = setInterval(() => {
    sportsData[sport].forEach((match, index) => {
      const kickoff = new Date(match.kickoff.replace(' ', 'T') + '+07:00');

      updateTimerDisplay(
        kickoff,
        `timer-${sport}-${index}`,
        `status-${sport}-${index}`
      );
    });
  }, 1000);
}

function updateTimerDisplay(targetDate, timerId, statusId) {
  const timerElem = document.getElementById(timerId);
  const statusElem = document.getElementById(statusId);

  if (!timerElem || !statusElem) return;

  const now = new Date();
  const diff = targetDate - now;

  if (diff <= 0) {
    statusElem.innerHTML =
      `<span class="status-badge status-live">LIVE</span>`;

    timerElem.innerHTML = `NOW LIVE`;
    timerElem.style.color = "#22c55e";

  } else {
    statusElem.innerHTML =
      `<span class="status-badge status-upcoming">UPCOMING</span>`;

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);

    timerElem.innerHTML =
      `${d}d : ${h}h : ${m}m : ${s}s`;
  }
}

function showCategories() {
  currentOpenSport = null;

  if (timerInterval) clearInterval(timerInterval);

  document.getElementById('view-matches').classList.add('hidden');
  document.getElementById('view-categories').classList.remove('hidden');
}

function openPlayer(match) {
  document.getElementById('player-view').classList.remove('hidden');
  document.getElementById('player-info').textContent = match.tag;

  const selector = document.getElementById('server-selector');
  const iframe = document.getElementById('stream-player');

  selector.innerHTML = '';

  if (!match.iframes || match.iframes.length === 0) {
    iframe.src = '';
    return;
  }

  function loadStream(url) {
    iframe.src = 'about:blank';

    setTimeout(() => {
      iframe.src = url;
    }, 150);
  }

  match.iframes.forEach((server, index) => {
    const option = document.createElement('option');
    option.value = server.url;
    option.textContent = server.server || `Server ${index + 1}`;
    selector.appendChild(option);
  });

  loadStream(match.iframes[0].url);

  selector.onchange = function () {
    loadStream(this.value);
  };
}

async function closePlayer() {
  document.getElementById('player-view').classList.add('hidden');

  const iframe = document.getElementById('stream-player');
  iframe.src = 'about:blank';

  document.getElementById('server-selector').innerHTML = '';

  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
    }

    if (screen.orientation && screen.orientation.unlock) {
      screen.orientation.unlock();
    }

  } catch (e) {}
}

// Lock orientation ONLY when fullscreen button pressed manually
document.addEventListener("fullscreenchange", async () => {
  try {
    if (document.fullscreenElement) {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock("landscape");
      }
    } else {
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    }
  } catch (err) {
    console.log("Orientation lock error:", err);
  }
});

document.addEventListener("webkitfullscreenchange", async () => {
  try {
    if (document.webkitFullscreenElement) {
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock("landscape");
      }
    } else {
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    }
  } catch (err) {}
});

loadData();
setInterval(loadData, 30000);
</script>

</body>
</html>
