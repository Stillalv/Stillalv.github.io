<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Stream</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
    }

    .player{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:none;
    }

    /* Block klik popup layer */
    .anti-popup{
      position:fixed;
      inset:0;
      z-index:9999;
      background:transparent;
    }

    /* Tombol buka player */
    .play-btn{
      position:fixed;
      bottom:20px;
      right:20px;
      z-index:10000;
      background:#fff;
      color:#000;
      border:none;
      padding:12px 18px;
      border-radius:12px;
      font-weight:bold;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <iframe
    id="streamFrame"
    class="player"
    src="https://embedsports.top/embed/golf/9001/1"
    allowfullscreen
    allow="encrypted-media; picture-in-picture"
    frameborder="0">
  </iframe>

  <!-- Layer anti popup -->
  <div class="anti-popup" id="antiPopup"></div>

  <button class="play-btn" onclick="enablePlayer()">
    PLAY
  </button>

  <script>
    // Block popup/new tab
    window.open = function () {
      return null;
    };

    // Block klik awal supaya popup iframe tidak muncul
    function enablePlayer() {
      document.getElementById("antiPopup").style.display = "none";
    }

    // Block shortcut popup
    document.addEventListener("click", function(e){
      if(e.target.tagName === "A"){
        e.preventDefault();
      }
    }, true);

    // Block context menu
    document.addEventListener("contextmenu", e => e.preventDefault());

    // Block inspect sederhana
    document.addEventListener("keydown", function(e){
      if (
        e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key)) ||
        (e.ctrlKey && e.key === "U")
      ) {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
