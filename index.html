<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Stream Hub</title>
  <style>
    * {
      box-sizing: border-box;
    }body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #0a0a0a, #18181b);
  color: white;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 2rem;
  font-weight: bold;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
}

button {
  background: #27272a;
  color: white;
  border: none;
  padding: 15px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 1rem;
  transition: 0.2s;
}

button:hover {
  background: #3f3f46;
}

.match-card {
  background: #27272a;
  padding: 20px;
  border-radius: 15px;
  cursor: pointer;
}

.match-card:hover {
  background: #3f3f46;
}

iframe {
  width: 100%;
  height: 70vh;
  border: none;
  border-radius: 15px;
  background: black;
}

.hidden {
  display: none;
}

.back-btn {
  margin-bottom: 20px;
}

.server-list {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

  </style>
</head>
<body>
  <header>Sports Stream Hub</header>  <div class="container">
    <div id="sports-view">
      <h2>Select Sport</h2>
      <div class="grid" id="sports-list"></div>
    </div><div id="matches-view" class="hidden">
  <button class="back-btn" onclick="backToSports()">← Back to Sports</button>
  <h2 id="matches-title"></h2>
  <div id="matches-list" class="grid"></div>
</div>

<div id="player-view" class="hidden">
  <button class="back-btn" onclick="backToMatches()">← Back to Matches</button>
  <h2 id="player-title"></h2>
  <p id="player-league"></p>
  <iframe id="stream-player" allowfullscreen allow="encrypted-media; picture-in-picture" sandbox="allow-scripts allow-same-origin allow-fullscreen" referrerpolicy="no-referrer"></iframe>
  <div class="server-list" id="server-list"></div>
</div>

  </div>  <script>
    let sportsData = {};
    let currentSport = null;
    let currentMatch = null;

    async function loadStreams() {
      try {
        const res = await fetch('https://api.embedsportex.site/api/streams?cache=' + Date.now());
        sportsData = await res.json();
        renderSports();
      } catch (err) {
        document.body.innerHTML = '<h1 style="text-align:center; padding:50px;">Failed to load stream data.</h1>';
      }
    }

    function renderSports() {
      const sportsList = document.getElementById('sports-list');
      sportsList.innerHTML = '';

      Object.keys(sportsData).forEach(sport => {
        if (Array.isArray(sportsData[sport]) && sportsData[sport].length > 0) {
          const btn = document.createElement('button');
          btn.textContent = sport.toUpperCase();
          btn.onclick = () => showMatches(sport);
          sportsList.appendChild(btn);
        }
      });
    }

    function showMatches(sport) {
      currentSport = sport;
      document.getElementById('sports-view').classList.add('hidden');
      document.getElementById('matches-view').classList.remove('hidden');
      document.getElementById('matches-title').textContent = sport.toUpperCase() + ' Matches';

      const matchesList = document.getElementById('matches-list');
      matchesList.innerHTML = '';

      sportsData[sport].forEach(match => {
        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
          <h3>${match.tag || 'Unknown Match'}</h3>
          <p>${match.league || ''}</p>
          <small>${match.kickoff || ''}</small>
        `;
        card.onclick = () => showPlayer(match);
        matchesList.appendChild(card);
      });
    }

    function showPlayer(match) {
      currentMatch = match;
      document.getElementById('matches-view').classList.add('hidden');
      document.getElementById('player-view').classList.remove('hidden');

      document.getElementById('player-title').textContent = match.tag;
      document.getElementById('player-league').textContent = match.league || '';
      document.getElementById('stream-player').src = match.iframes[0].url;

      const serverList = document.getElementById('server-list');
      serverList.innerHTML = '';

      match.iframes.forEach(server => {
        const btn = document.createElement('button');
        btn.textContent = server.server || 'Server';
        btn.onclick = () => {
          document.getElementById('stream-player').src = server.url;
        };
        serverList.appendChild(btn);
      });
    }

    function backToSports() {
      document.getElementById('matches-view').classList.add('hidden');
      document.getElementById('sports-view').classList.remove('hidden');
    }

    function backToMatches() {
      document.getElementById('player-view').classList.add('hidden');
      document.getElementById('matches-view').classList.remove('hidden');
    }

    loadStreams();
  </script></body>
</html>
