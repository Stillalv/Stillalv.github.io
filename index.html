<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Stream Hub</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #0b0b0f 0%, #111111 30%, #0f0f14 65%, #000000 100%);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(18px);
      background: rgba(10,10,10,0.88);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 16px 18px;
      text-align: center;
      font-size: 1.45rem;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }

    .container {
      padding: 16px;
      width: 100%;
    }

    h2 {
      font-size: 1.8rem;
      margin-bottom: 18px;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }

    button {
      background: linear-gradient(to bottom, rgba(35,35,35,0.96), rgba(20,20,20,0.98));
      color: white;
      border: 1px solid rgba(255,255,255,0.05);
      padding: 14px 10px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 800;
      transition: all 0.25s ease;
      min-height: 64px;
      width: 100%;
    }

    button:hover,
    button:active {
      transform: scale(0.98);
      background: linear-gradient(to bottom, rgba(229,9,20,0.95), rgba(180,0,10,0.95));
    }

    .back-btn {
      width: auto;
      padding: 12px 20px;
      margin-bottom: 20px;
    }

    .match-card {
      background: linear-gradient(to bottom, rgba(28,28,28,0.98), rgba(12,12,12,0.98));
      padding: 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      aspect-ratio: 0.82 / 1;
      min-height: 0;
    }

    .match-card:hover,
    .match-card:active {
      transform: translateY(-4px);
      border-color: rgba(229,9,20,0.22);
    }

    .match-card h3 {
      font-size: clamp(0.95rem, 2.8vw, 1.1rem);
      margin: 0 0 10px;
      line-height: 1.25;
      font-weight: 800;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .match-card p {
      margin: 0;
      color: #b3b3b3;
      font-size: clamp(0.75rem, 2.2vw, 0.9rem);
      line-height: 1.35;
    }

    .match-card small {
      display: block;
      margin-top: 10px;
      color: #8c8c8c;
      font-size: clamp(0.68rem, 2vw, 0.8rem);
      line-height: 1.35;
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      color: #22c55e;
      font-weight: 800;
      font-size: 0.88rem;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.5s infinite;
    }

    .countdown-status {
      margin-top: 12px;
      color: #facc15;
      font-weight: 700;
      font-size: 0.78rem;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.7; }
    }

    iframe {
      width: 100%;
      height: 240px;
      border: none;
      border-radius: 18px;
      background: black;
      margin-top: 12px;
    }

    .server-list {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .hidden {
      display: none;
    }

    .refresh-info,
    .error {
      text-align: center;
      color: #6b7280;
      margin-top: 14px;
    }

    @media (min-width: 768px) {
      .container {
        max-width: 760px;
        margin: auto;
      }

      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      iframe {
        height: 420px;
      }
    }
  </style>
</head>
<body>

<header>⚽ Sports Stream Hub</header>

<div class="container">

  <div id="sports-view">
    <h2>Select Sport</h2>
    <div class="grid" id="sports-list"></div>
    <div class="refresh-info">Auto refresh every 30 seconds</div>
  </div>

  <div id="matches-view" class="hidden">
    <button class="back-btn" onclick="backToSports()">← Back</button>
    <h2 id="matches-title"></h2>
    <div id="matches-list" class="grid"></div>
  </div>

  <div id="player-view" class="hidden">
    <button class="back-btn" onclick="backToMatches()">← Back</button>
    <h2 id="player-title"></h2>
    <p id="player-league"></p>

    <iframe
      id="stream-player"
      allowfullscreen
      allow="encrypted-media; picture-in-picture"
      sandbox="allow-scripts allow-same-origin allow-fullscreen"
      referrerpolicy="no-referrer">
    </iframe>

    <div class="server-list" id="server-list"></div>
  </div>

</div>

<script>
  let sportsData = {};
  let currentSport = null;
  let currentMatch = null;
  let lastFetchTime = 0;

  async function loadStreams(force = false) {
    const now = Date.now();
    if (!force && now - lastFetchTime < 30000) return;

    try {
      lastFetchTime = now;

      const res = await fetch('https://api.embedsportex.site/api/streams', {
        headers: { 'Accept': 'application/json' }
      });

      if (!res.ok) throw new Error('API request failed');

      sportsData = await res.json();
      renderSports();

    } catch (err) {
      console.error(err);
      document.body.innerHTML = `
        <header>⚽ Sports Stream Hub</header>
        <div class="error">
          <h2>Failed to load stream data.</h2>
          <p>API unavailable or blocked.</p>
        </div>
      `;
    }
  }

  function renderSports() {
    const sportsList = document.getElementById('sports-list');
    sportsList.innerHTML = '';

    Object.keys(sportsData).forEach(sport => {
      if (Array.isArray(sportsData[sport]) && sportsData[sport].length > 0) {
        const btn = document.createElement('button');
        btn.textContent = sport.toUpperCase();
        btn.onclick = () => showMatches(sport);
        sportsList.appendChild(btn);
      }
    });
  }

  function showMatches(sport) {
    currentSport = sport;
    document.getElementById('sports-view').classList.add('hidden');
    document.getElementById('matches-view').classList.remove('hidden');
    document.getElementById('matches-title').textContent = sport.toUpperCase() + ' Matches';

    const matchesList = document.getElementById('matches-list');
    matchesList.innerHTML = '';

    sportsData[sport].forEach(match => {
      const card = document.createElement('div');
      card.className = 'match-card';

      let statusHTML = '';
      if (match.kickoff) {
        const kickoffDate = new Date(match.kickoff);
        const now = new Date();

        if (!isNaN(kickoffDate)) {
          if (now >= kickoffDate) {
            statusHTML = `
              <div class="live-status">
                <span class="live-dot"></span>
                LIVE
              </div>`;
          } else {
            const diffMs = kickoffDate - now;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const diffMinutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

            let countdownText = diffDays > 0
              ? `${diffDays}d ${diffHours}h until start`
              : diffHours > 0
              ? `${diffHours}h ${diffMinutes}m until start`
              : `${diffMinutes}m until start`;

            statusHTML = `<div class="countdown-status">${countdownText}</div>`;
          }
        }
      }

      card.innerHTML = `
        <h3>${match.tag || 'Unknown Match'}</h3>
        <p>${match.league || ''}</p>
        <small>${match.kickoff || ''}</small>
        ${statusHTML}
      `;

      card.onclick = () => showPlayer(match);
      matchesList.appendChild(card);
    });
  }

  function showPlayer(match) {
    currentMatch = match;
    document.getElementById('matches-view').classList.add('hidden');
    document.getElementById('player-view').classList.remove('hidden');

    document.getElementById('player-title').textContent = match.tag || 'Unknown Match';
    document.getElementById('player-league').textContent = match.league || '';

    const player = document.getElementById('stream-player');
    player.src = match.iframes?.[0]?.url || '';

    const serverList = document.getElementById('server-list');
    serverList.innerHTML = '';

    match.iframes?.forEach(server => {
      const btn = document.createElement('button');
      btn.textContent = server.server || 'Server';
      btn.onclick = () => player.src = server.url;
      serverList.appendChild(btn);
    });
  }

  function backToSports() {
    document.getElementById('matches-view').classList.add('hidden');
    document.getElementById('sports-view').classList.remove('hidden');
  }

  function backToMatches() {
    document.getElementById('player-view').classList.add('hidden');
    document.getElementById('matches-view').classList.remove('hidden');
  }

  loadStreams(true);
  setInterval(() => loadStreams(), 30000);
</script>

</body>
</html>
