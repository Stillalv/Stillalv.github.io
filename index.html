<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Stream Hub</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at top right, #1d4ed8 0%, transparent 30%),
        radial-gradient(circle at top left, #7c3aed 0%, transparent 25%),
        linear-gradient(to bottom, #09090b, #111827);
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(16px);
      background: rgba(10,10,15,0.78);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 18px 20px;
      text-align: center;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .container {
      padding: 18px;
      max-width: 100%;
    }

    h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      font-weight: 800;
      color: #f8fafc;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    button {
      background: rgba(255,255,255,0.06);
      color: white;
      border: 1px solid rgba(255,255,255,0.08);
      padding: 14px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      transition: all 0.25s ease;
      backdrop-filter: blur(14px);
    }

    button:hover,
    button:active {
      transform: scale(0.98);
      background: rgba(59,130,246,0.25);
      border-color: rgba(59,130,246,0.4);
    }

    .match-card {
      background: rgba(255,255,255,0.06);
      padding: 18px;
      border-radius: 18px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.25s;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 270px;
      height: 100%;
    }

    .match-card:hover,
    .match-card:active {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.09);
    }

    .match-card h3 {
      font-size: 1rem;
      margin: 0 0 10px;
      color: #ffffff;
      line-height: 1.3;
      font-weight: 800;
    }

    .match-card p {
      margin: 0;
      color: #cbd5e1;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .match-card small {
      display: block;
      margin-top: 10px;
      color: #94a3b8;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      color: #22c55e;
      font-weight: 800;
      font-size: 0.9rem;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.5s infinite;
    }

    .countdown-status {
      display: inline-block;
      margin-top: 12px;
      color: #facc15;
      font-weight: 700;
      font-size: 0.85rem;
      line-height: 1.4;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }

    iframe {
      width: 100%;
      height: 250px;
      border: none;
      border-radius: 18px;
      background: black;
      margin-top: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .hidden {
      display: none;
    }

    .back-btn {
      margin-bottom: 18px;
      width: auto;
      padding: 12px 18px;
      font-size: 0.9rem;
      border-radius: 14px;
    }

    .server-list {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .server-list button {
      flex: 1 1 auto;
      min-width: 90px;
      font-size: 0.85rem;
    }

    #player-title {
      margin-top: 10px;
      font-size: 1.2rem;
      font-weight: 800;
    }

    #player-league {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .error {
      text-align: center;
      padding: 60px 20px;
      color: #e5e7eb;
      font-size: 1rem;
    }

    .refresh-info {
      text-align: center;
      color: #94a3b8;
      font-size: 0.78rem;
      margin-top: 8px;
    }

    @media (min-width: 768px) {
      .container {
        max-width: 700px;
        margin: auto;
      }

      iframe {
        height: 400px;
      }

      .grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>

<header>⚽ Sports Stream Hub</header>

<div class="container">

  <div id="sports-view">
    <h2>Select Sport</h2>
    <div class="grid" id="sports-list"></div>
    <div class="refresh-info">Auto refresh every 30 seconds</div>
  </div>

  <div id="matches-view" class="hidden">
    <button class="back-btn" onclick="backToSports()">← Back</button>
    <h2 id="matches-title"></h2>
    <div id="matches-list" class="grid"></div>
  </div>

  <div id="player-view" class="hidden">
    <button class="back-btn" onclick="backToMatches()">← Back</button>
    <h2 id="player-title"></h2>
    <p id="player-league"></p>

    <iframe
      id="stream-player"
      allowfullscreen
      allow="encrypted-media; picture-in-picture"
      sandbox="allow-scripts allow-same-origin allow-fullscreen"
      referrerpolicy="no-referrer">
    </iframe>

    <div class="server-list" id="server-list"></div>
  </div>

</div>

<script>
  let sportsData = {};
  let currentSport = null;
  let currentMatch = null;
  let lastFetchTime = 0;

  async function loadStreams(force = false) {
    const now = Date.now();

    // Anti aggressive polling
    if (!force && now - lastFetchTime < 30000) {
      return;
    }

    try {
      lastFetchTime = now;

      const res = await fetch(
        'https://api.embedsportex.site/api/streams',
        {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        }
      );

      if (!res.ok) {
        throw new Error('API request failed');
      }

      sportsData = await res.json();

      if (!sportsData || Object.keys(sportsData).length === 0) {
        throw new Error('No stream data available');
      }

      renderSports();

      if (currentSport) {
        showMatches(currentSport);
      }

      if (currentMatch) {
        showPlayer(currentMatch);
      }

    } catch (err) {
      console.error(err);

      document.body.innerHTML = `
        <header>⚽ Sports Stream Hub</header>
        <div class="error">
          <h2>Failed to load stream data.</h2>
          <p style="color:#94a3b8;">
            API unavailable, blocked, or rate limited.
          </p>
        </div>
      `;
    }
  }

  function renderSports() {
    const sportsList = document.getElementById('sports-list');
    sportsList.innerHTML = '';

    Object.keys(sportsData).forEach(sport => {
      if (Array.isArray(sportsData[sport]) && sportsData[sport].length > 0) {
        const btn = document.createElement('button');
        btn.textContent = sport.toUpperCase();
        btn.onclick = () => showMatches(sport);
        sportsList.appendChild(btn);
      }
    });
  }

  function showMatches(sport) {
    currentSport = sport;

    document.getElementById('sports-view').classList.add('hidden');
    document.getElementById('matches-view').classList.remove('hidden');

    document.getElementById('matches-title').textContent =
      sport.toUpperCase() + ' Matches';

    const matchesList = document.getElementById('matches-list');
    matchesList.innerHTML = '';

    sportsData[sport].forEach(match => {
      const card = document.createElement('div');
      card.className = 'match-card';

      let statusHTML = '';

      if (match.kickoff) {
        const kickoffDate = new Date(match.kickoff);
        const now = new Date();

        if (!isNaN(kickoffDate)) {
          if (now >= kickoffDate) {
            statusHTML = `
              <div class="live-status">
                <span class="live-dot"></span>
                LIVE
              </div>
            `;
          } else {
            const diffMs = kickoffDate - now;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffHours = Math.floor(
              (diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
            );
            const diffMinutes = Math.floor(
              (diffMs % (1000 * 60 * 60)) / (1000 * 60)
            );

            let countdownText = '';

            if (diffDays > 0) {
              countdownText = `${diffDays}d ${diffHours}h until start`;
            } else if (diffHours > 0) {
              countdownText = `${diffHours}h ${diffMinutes}m until start`;
            } else {
              countdownText = `${diffMinutes}m until start`;
            }

            statusHTML = `
              <div class="countdown-status">
                ${countdownText}
              </div>
            `;
          }
        }
      }

      card.innerHTML = `
        <h3>${match.tag || 'Unknown Match'}</h3>
        <p>${match.league || ''}</p>
        <small>${match.kickoff || ''}</small>
        ${statusHTML}
      `;

      card.onclick = () => showPlayer(match);

      matchesList.appendChild(card);
    });
  }

  function showPlayer(match) {
    currentMatch = match;

    document.getElementById('matches-view').classList.add('hidden');
    document.getElementById('player-view').classList.remove('hidden');

    document.getElementById('player-title').textContent =
      match.tag || 'Unknown Match';

    document.getElementById('player-league').textContent =
      match.league || '';

    const player = document.getElementById('stream-player');
    player.src = match.iframes?.[0]?.url || '';

    const serverList = document.getElementById('server-list');
    serverList.innerHTML = '';

    if (match.iframes) {
      match.iframes.forEach(server => {
        const btn = document.createElement('button');
        btn.textContent = server.server || 'Server';

        btn.onclick = () => {
          player.src = server.url;
        };

        serverList.appendChild(btn);
      });
    }
  }

  function backToSports() {
    document.getElementById('matches-view').classList.add('hidden');
    document.getElementById('sports-view').classList.remove('hidden');
  }

  function backToMatches() {
    document.getElementById('player-view').classList.add('hidden');
    document.getElementById('matches-view').classList.remove('hidden');
  }

  // Initial load
  loadStreams(true);

  // Refresh tiap 30 detik sesuai aturan API
  setInterval(() => {
    loadStreams();
  }, 30000);
</script>

</body>
</html>
