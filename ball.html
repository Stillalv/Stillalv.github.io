<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Stream Hub</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <style>
    :root {
      --netflix-red: #E50914;
      --bg-color: #141414;
      --card-bg: #1f1f1f;
      --text-main: #ffffff;
      --text-muted: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      padding: 18px 4%;
      background: rgba(20,20,20,0.96);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--netflix-red);
      letter-spacing: 1px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 20px 4%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 14px;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0,1fr));
      }
    }

    .category-card {
      background: linear-gradient(145deg, #2c2c2c, #171717);
      border-radius: 16px;
      padding: 30px 12px;
      text-align: center;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.04);
      transition: 0.2s;
    }

    .category-card:active {
      transform: scale(0.96);
    }

    .category-icon {
      display: block;
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    .category-name {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 170px;
      border: 1px solid rgba(255,255,255,0.03);
      transition: 0.2s;
    }

    .match-card:active {
      transform: scale(0.98);
    }

    .match-card h3 {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 10px 0;
      line-height: 1.4;
    }

    .match-card p {
      color: var(--text-muted);
      font-size: 0.78rem;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status-live {
      background: var(--netflix-red);
      color: white;
      animation: pulse 2s infinite;
    }

    .status-upcoming {
      background: #444;
      color: #ccc;
    }

    .countdown-timer {
      margin-top: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: #ffcc00;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .local-time {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .back-btn {
      background: #333;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .bookmark-btn {
      background: rgba(229, 9, 20, 0.3);
      color: #E50914;
      border: 1px solid #E50914;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: 0.2s;
      margin-top: 8px;
    }

    .bookmark-btn.active {
      background: #E50914;
      color: white;
    }

    .bookmark-btn:active {
      transform: scale(0.95);
    }

    .tab-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: #333;
      color: #b3b3b3;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s;
    }

    .tab-btn.active {
      background: #E50914;
      color: white;
      border-color: #E50914;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #b3b3b3;
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #222;
      color: white;
      font-size: 1rem;
      margin-bottom: 15px;
    }

    .search-box::placeholder {
      color: #999;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: #333;
      color: #b3b3b3;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .filter-btn.active {
      background: #E50914;
      color: white;
      border-color: #E50914;
    }

    .filter-btn:active {
      transform: scale(0.96);
    }

    .clear-btn {
      background: rgba(229, 9, 20, 0.2);
      color: #E50914;
      border: 1px solid #E50914;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .clear-btn:active {
      transform: scale(0.96);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .livechat-container {
      display: flex;
      flex-direction: column;
      height: 40%;
      background: #0a0a0a;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .livechat-header {
      padding: 10px 12px;
      background: #1a1a1a;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.9rem;
      font-weight: 700;
      color: #E50914;
    }

    .livechat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-message {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      border-left: 2px solid #E50914;
    }

    .chat-username {
      font-size: 0.75rem;
      color: #E50914;
      font-weight: 700;
    }

    .chat-text {
      font-size: 0.85rem;
      color: #ffffff;
      word-break: break-word;
    }

    .chat-time {
      font-size: 0.7rem;
      color: #666;
    }

    .livechat-input-box {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: #1a1a1a;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .chat-input {
      flex: 1;
      padding: 8px 12px;
      background: #222;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: white;
      font-size: 0.85rem;
    }

    .chat-input::placeholder {
      color: #666;
    }

    .send-btn {
      background: #E50914;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: 0.2s;
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .hidden {
      display: none !important;
    }

    @keyframes pulse {
      0% {opacity: 1;}
      50% {opacity: 0.6;}
      100% {opacity: 1;}
    }

    #player-view {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 200;
      display: flex;
      flex-direction: column;
    }

    .player-header {
      padding: 12px;
      background: #141414;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .player-title {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #server-selector {
      background: #222;
      color: white;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      max-width: 150px;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
      max-height: 60vh;
    }

    #stream-player {
      width: 100%;
      height: 100%;
      border: none;
    }

    #player-view:fullscreen .video-wrapper,
    #player-view:-webkit-full-screen .video-wrapper {
      width: 100vw;
      height: 100vh;
      max-height: 100vh;
      aspect-ratio: auto;
    }

    #player-view:fullscreen iframe,
    #player-view:-webkit-full-screen iframe {
      width: 100%;
      height: 100%;
    }

    @media (max-width: 768px) {
      .video-wrapper {
        max-height: 40vh;
      }

      #server-selector {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

<header>SPORTSFLIX</header>

<div class="container">

  <div id="view-categories">
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="showCategories()">⚽ All Sports</button>
      <button class="tab-btn" onclick="showFavorites()">❤️ Favorites</button>
    </div>
    <h2 style="margin-bottom:20px;">Choose Sport</h2>
    <div id="loading" style="text-align:center; padding:50px;">Connecting...</div>
    <div class="grid" id="category-list"></div>
  </div>

  <div id="view-matches" class="hidden">
    <button class="back-btn" onclick="showCategories()">← Back</button>
    <h2 id="match-title-text" style="margin:20px 0;"></h2>
    
    <input type="text" id="search-input" class="search-box" placeholder="🔍 Search team or league..." />
    
    <div class="filter-buttons">
      <button class="filter-btn active" onclick="filterMatches('ALL')">All</button>
      <button class="filter-btn" onclick="filterMatches('LIVE')">🔴 LIVE</button>
      <button class="filter-btn" onclick="filterMatches('UPCOMING')">⏰ Upcoming</button>
    </div>
    
    <div class="grid" id="match-list"></div>
  </div>

  <div id="view-favorites" class="hidden">
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="showFavorites()">❤️ My Favorites</button>
      <button class="tab-btn" onclick="showHistory()">📺 History</button>
      <button class="tab-btn" onclick="showCategories()">← Back to Sports</button>
    </div>
    <h2 style="margin:20px 0;">Saved Matches</h2>
    <div id="favorites-empty" class="empty-state">
      <div class="empty-state-icon">📌</div>
      <p>No favorites yet. Bookmark matches to save them here!</p>
    </div>
    <div class="grid" id="favorites-list"></div>
  </div>

  <div id="view-history" class="hidden">
    <div class="tab-buttons">
      <button class="tab-btn" onclick="showFavorites()">❤️ My Favorites</button>
      <button class="tab-btn active" onclick="showHistory()">📺 History</button>
      <button class="tab-btn" onclick="showCategories()">← Back to Sports</button>
    </div>
    <div class="history-header">
      <h2 style="margin:0;">Watch History</h2>
      <button class="clear-btn" onclick="clearHistory()">Clear History</button>
    </div>
    <div id="history-empty" class="empty-state">
      <div class="empty-state-icon">📺</div>
      <p>No watch history yet. Watch matches to see them here!</p>
    </div>
    <div class="grid" id="history-list"></div>
  </div>

</div>

<div id="player-view" class="hidden">
  <div class="player-header">
    <button class="back-btn" onclick="closePlayer()">← Close</button>
    <div id="player-info" class="player-title"></div>
    <select id="server-selector"></select>
  </div>

  <div class="video-wrapper">
    <iframe
      id="stream-player"
      allow="encrypted-media; picture-in-picture; fullscreen"
      sandbox="allow-scripts allow-popups allow-forms allow-same-origin"
      referrerpolicy="no-referrer">
    </iframe>
  </div>

  <div class="livechat-container">
    <div class="livechat-header">💬 Live Chat - Shared Multiplayer</div>
    <div class="livechat-messages" id="chat-messages"></div>
    <div class="livechat-input-box">
      <input type="text" id="chat-input" class="chat-input" placeholder="Type message..." maxlength="150" />
      <button class="send-btn" onclick="sendChatMessage()">Send</button>
    </div>
  </div>
</div>

<script>
// ===== FIREBASE CDN SDK =====
// Add Firebase scripts dynamically to avoid module issues
(function() {
  let loadedCount = 0;
  
  function checkAllLoaded() {
    loadedCount++;
    if (loadedCount === 2) {
      initializeFirebase();
    }
  }
  
  const script1 = document.createElement('script');
  script1.src = 'https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js';
  script1.onload = checkAllLoaded;
  document.head.appendChild(script1);
  
  const script2 = document.createElement('script');
  script2.src = 'https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js';
  script2.onload = checkAllLoaded;
  document.head.appendChild(script2);
})();

function initializeFirebase() {
  if (typeof firebase === 'undefined') {
    console.error('Firebase SDK not loaded');
    return;
  }
  
  const firebaseConfig = {
    apiKey: "AIzaSyBMdU3o0H_Z2P6YweWiSqlWOEAx5hMD1rw",
    authDomain: "sportflix-37b4c.firebaseapp.com",
    databaseURL: "https://sportflix-37b4c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "sportflix-37b4c",
    storageBucket: "sportflix-37b4c.firebasestorage.app",
    messagingSenderId: "1014118712257",
    appId: "1:1014118712257:web:fdef2cfc845895cef52540",
    measurementId: "G-CXVYGNWDNN"
  };

  try {
    firebase.initializeApp(firebaseConfig);
    window.database = firebase.database();
    console.log('✅ Firebase initialized successfully');
  } catch (err) {
    console.error('Firebase init error:', err);
  }
}

// ===== MAIN APP SCRIPT =====

const sportIcons = {
  football: '⚽',
  basketball: '🏀',
  amfootball: '🏈',
  baseball: '⚾',
  badminton: '🏸',
  volleyball: '🏐',
  tennis: '🎾',
  race: '🏁',
  fight: '🥊',
  other: '🎯'
};

let sportsData = {};
let currentOpenSport = null;
let timerInterval = null;
let favorites = [];
let favoriteMatches = {}; // Store full match data untuk offline access
let watchHistory = []; // Store watch history
let filterStatus = 'ALL'; // Current filter status (ALL, LIVE, UPCOMING)

// ===== FAVORITES MANAGEMENT =====
function loadFavorites() {
  const saved = localStorage.getItem('sportsflixFavorites');
  const savedMatches = localStorage.getItem('sportsflixFavoriteMatches');
  
  favorites = saved ? JSON.parse(saved) : [];
  favoriteMatches = savedMatches ? JSON.parse(savedMatches) : {};
}

function saveFavorites() {
  localStorage.setItem('sportsflixFavorites', JSON.stringify(favorites));
  localStorage.setItem('sportsflixFavoriteMatches', JSON.stringify(favoriteMatches));
}

// ===== WATCH HISTORY MANAGEMENT =====
function loadHistory() {
  const saved = localStorage.getItem('sportsflixHistory');
  watchHistory = saved ? JSON.parse(saved) : [];
}

function saveHistory() {
  localStorage.setItem('sportsflixHistory', JSON.stringify(watchHistory));
}

function addToHistory(match) {
  const matchId = getMatchId(match);
  
  // Remove if already exists (to move it to top)
  watchHistory = watchHistory.filter(item => getMatchId(item) !== matchId);
  
  // Add to beginning (most recent first)
  watchHistory.unshift(match);
  
  // Keep only last 20 items
  watchHistory = watchHistory.slice(0, 20);
  
  saveHistory();
}

function clearHistory() {
  if (!confirm('Clear all watch history?')) return;
  
  watchHistory = [];
  saveHistory();
  renderHistoryList();
}

// ===== FIREBASE LIVE CHAT MANAGEMENT =====
let currentChatListener = null;
const MAX_MESSAGES = 100;

function loadChatMessages() {
  if (!window.database) {
    console.warn('Firebase not initialized yet');
    return;
  }
  
  const messagesRef = window.database.ref('chat/messages');
  
  if (currentChatListener) {
    messagesRef.off('value', currentChatListener);
  }
  
  currentChatListener = messagesRef.orderByChild('timestamp').limitToLast(50).on('value', (snapshot) => {
    renderChatMessages(snapshot.val());
  });
}

function renderChatMessages(messagesObj) {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  
  container.innerHTML = '';
  
  if (!messagesObj) {
    container.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">No messages yet. Start chatting!</div>';
    return;
  }
  
  Object.values(messagesObj).forEach(msg => {
    if (!msg || !msg.text) return;
    
    const msgElem = document.createElement('div');
    msgElem.className = 'chat-message';
    
    const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { 
      hour: '2-digit', 
      minute: '2-digit' 
    });
    
    msgElem.innerHTML = `
      <div class="chat-username">${msg.username}</div>
      <div class="chat-text">${msg.text}</div>
      <div class="chat-time">${timeStr}</div>
    `;
    
    container.appendChild(msgElem);
  });
  
  // Auto scroll to bottom
  container.scrollTop = container.scrollHeight;
}

function sendChatMessage() {
  if (!window.database) {
    alert('Firebase not connected yet. Please wait...');
    return;
  }
  
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  
  if (!text) return;
  
  const username = 'User' + Math.floor(Math.random() * 9999);
  const timestamp = Date.now();
  
  const messagesRef = window.database.ref('chat/messages');
  const newMessageRef = messagesRef.push();
  
  newMessageRef.set({
    username: username,
    text: text,
    timestamp: timestamp
  }).then(() => {
    input.value = '';
    // Auto cleanup old messages if too many (keep max 50)
    messagesRef.once('value', snap => {
      const messageCount = snap.numChildren();
      if (messageCount > 50) {
        // Only delete oldest 10 if over 50
        messagesRef.orderByChild('timestamp').limitToFirst(10).once('value', oldSnap => {
          oldSnap.forEach(msg => {
            msg.ref.remove();
          });
        });
      }
    });
  }).catch(error => {
    console.error('Chat error:', error);
    alert('Failed to send message. Check Firebase connection.');
  });
}

function getMatchId(match) {
  return `${match.tag}-${match.league}`.replace(/\s+/g, '_');
}

function toggleFavorite(matchId, btn, matchData = null) {
  if (favorites.includes(matchId)) {
    favorites = favorites.filter(id => id !== matchId);
    delete favoriteMatches[matchId];
  } else {
    favorites.push(matchId);
    if (matchData) {
      favoriteMatches[matchId] = matchData;
    }
  }

  saveFavorites();

  // Update button UI
  btn.classList.toggle('active');
  btn.textContent = btn.classList.contains('active') ? '❤️ Saved' : '🤍 Save';

  // Update favorites view if open
  if (!document.getElementById('view-favorites').classList.contains('hidden')) {
    renderFavoritesList();
  }
}

function showFavorites() {
  currentOpenSport = null;

  if (timerInterval) clearInterval(timerInterval);

  document.getElementById('view-categories').classList.add('hidden');
  document.getElementById('view-matches').classList.add('hidden');
  document.getElementById('view-favorites').classList.remove('hidden');

  renderFavoritesList();
}

function renderFavoritesList() {
  const favoritesList = document.getElementById('favorites-list');
  const emptyState = document.getElementById('favorites-empty');
  favoritesList.innerHTML = '';

  if (favorites.length === 0) {
    emptyState.classList.remove('hidden');
    return;
  }

  emptyState.classList.add('hidden');

  // Use stored match data from localStorage
  favorites.forEach(matchId => {
    const match = favoriteMatches[matchId];
    
    if (!match) return; // Skip if match data not found

    const kickoff = new Date(match.kickoff.replace(' ', 'T') + '+07:00');

    const timeString = kickoff.toLocaleTimeString([], {
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });

    const dateString = kickoff.toLocaleDateString([], {
      day: 'numeric',
      month: 'short'
    });

    const card = document.createElement('d
