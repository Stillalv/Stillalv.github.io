<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Esports Tournament Maker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1, h2, h3 {
      text-align: center;
      color: #333;
    }
    .input-group {
      margin-bottom: 15px;
    }
    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .input-group input, .input-group select, .input-group textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .button {
      display: inline-block;
      padding: 10px 15px;
      margin-top: 10px;
      background: #007bff;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
    }
    .button:hover {
      background: #0056b3;
    }
    .team-list {
      margin-top: 20px;
    }
    .team-list ul {
      list-style: none;
      padding: 0;
    }
    .team-list li {
      background: #f9f9f9;
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .settings-section {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Advanced Esports Tournament Maker</h1>

    <!-- Step 1: Tournament Creation -->
    <div id="tournament-creation">
      <h2>Create Tournament</h2>
      <div class="input-group">
        <label for="tournament-name">Tournament Name</label>
        <input type="text" id="tournament-name" placeholder="Enter tournament name">
      </div>
      <div class="input-group">
        <label for="tournament-type">Tournament Type</label>
        <select id="tournament-type">
          <option value="group">Group Stage</option>
          <option value="playoff">Playoffs</option>
          <option value="swiss">Swiss</option>
          <option value="combined">Combined</option>
        </select>
      </div>
      <button class="button" onclick="createTournament()">Create Tournament</button>
    </div>

    <!-- Step 2: Tournament Settings -->
    <div id="tournament-settings" class="settings-section">
      <h2>Configure Tournament</h2>
      <div class="input-group">
        <label for="score-settings">Score Settings</label>
        <textarea id="score-settings" placeholder="Define score rules (e.g., Win: 3 points, Draw: 1 point, Loss: 0 points)"></textarea>
      </div>
      <div class="input-group">
        <label for="max-teams">Maximum Number of Teams</label>
        <input type="number" id="max-teams" min="2" max="64" placeholder="Enter max number of teams">
      </div>
      <button class="button" onclick="saveSettings()">Save Settings</button>
    </div>

    <!-- Step 3: Team Management -->
    <div id="team-management" class="settings-section">
      <h2>Manage Teams</h2>
      <div class="input-group">
        <label for="team-name">Add Team</label>
        <input type="text" id="team-name" placeholder="Enter team name">
        <input type="text" id="team-country" placeholder="Enter team country">
      </div>
      <button class="button" onclick="addTeam()">Add Team</button>
      <div class="team-list">
        <h3>Teams</h3>
        <ul id="team-list"></ul>
      </div>
      <button class="button" onclick="finalizeTournament()">Finalize Tournament</button>
    </div>

    <!-- Step 4: Tournament Summary -->
    <div id="tournament-summary" class="settings-section">
      <h2>Tournament Summary</h2>
      <div id="output"></div>
    </div>
  </div>

  <script>
    let tournament = {};
    const teams = [];

    function createTournament() {
      const name = document.getElementById('tournament-name').value;
      const type = document.getElementById('tournament-type').value;

      if (!name || !type) {
        alert('Please fill in all tournament details');
        return;
      }

      tournament = { name, type, settings: {}, teams: [] };
      document.getElementById('tournament-creation').style.display = 'none';
      document.getElementById('tournament-settings').style.display = 'block';
    }

    function saveSettings() {
      const scoreSettings = document.getElementById('score-settings').value;
      const maxTeams = document.getElementById('max-teams').value;

      if (!scoreSettings || !maxTeams) {
        alert('Please fill in all settings');
        return;
      }

      tournament.settings = { scoreSettings, maxTeams: parseInt(maxTeams, 10) };
      document.getElementById('tournament-settings').style.display = 'none';
      document.getElementById('team-management').style.display = 'block';
    }

    function addTeam() {
      const teamName = document.getElementById('team-name').value;
      const teamCountry = document.getElementById('team-country').value;

      if (teams.length >= tournament.settings.maxTeams) {
        alert('Maximum number of teams reached');
        return;
      }

      if (teamName && teamCountry) {
        teams.push({ name: teamName, country: teamCountry });
        document.getElementById('team-name').value = '';
        document.getElementById('team-country').value = '';
        updateTeamList();
      } else {
        alert('Please fill out both fields');
      }
    }

    function updateTeamList() {
      const teamList = document.getElementById('team-list');
      teamList.innerHTML = '';
      teams.forEach((team, index) => {
        const li = document.createElement('li');
        li.textContent = `${team.name} (${team.country})`;
        teamList.appendChild(li);
      });
    }

    function finalizeTournament() {
      if (teams.length < 2) {
        alert('Add at least two teams to finalize the tournament');
        return;
      }

      tournament.teams = teams;
      document.getElementById('team-management').style.display = 'none';
      document.getElementById('tournament-summary').style.display = 'block';
      displaySummary();
    }

    function displaySummary() {
      const output = document.getElementById('output');
      output.innerHTML = `
        <h3>${tournament.name}</h3>
        <p>Type: ${tournament.type}</p>
        <p>Score Settings: ${tournament.settings.scoreSettings}</p>
        <p>Max Teams: ${tournament.settings.maxTeams}</p>
        <h4>Teams:</h4>
        <ul>
          ${tournament.teams.map(team => `<li>${team.name} (${team.country})</li>`).join('')}
        </ul>
      `;
    }
  </script>
</body>
</html>
